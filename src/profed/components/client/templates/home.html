{% extends "base.html" %}
{% from "block.html" import timeline_block %}
{% block content %}
{% include "compose.html" %}
<section class="h-feed posts">
  {% for block in blocks %}
  {{ timeline_block(block) }}
  {% else %}
  <p class="empty">Your timeline is empty. Follow someone to see their posts here.</p>
  {% endfor %}
</section>
{% endblock %}
