{% set mine = (status.pleroma or {}).get("emoji_reactions", []) | selectattr("me") | list %}
<span class="reaction-area is-open" id="reactions-{{ status.id }}">
  <span class="reaction-choices">
    {% if mine %}
    <button type="button" class="action undo" title="Remove reaction" aria-label="Remove reaction"
            hx-post="/statuses/{{ status.id }}/unreact/{{ mine[0].name | urlencode }}"
            hx-target="#reactions-{{ status.id }}"
            hx-swap="outerHTML">&#9825;</button>
    {% endif %}
    <form class="emoji-picker"
          hx-post="/statuses/{{ status.id }}/react"
          hx-target="#reactions-{{ status.id }}"
          hx-swap="outerHTML">
      <span class="grid" hx-get="/emoji/choices" hx-trigger="load" hx-swap="innerHTML"></span>
    </form>
    <button type="button" class="action close" title="Close" aria-label="Close"
            hx-get="/statuses/{{ status.id }}/reactions"
            hx-target="#reactions-{{ status.id }}"
            hx-swap="outerHTML">&times;</button>
  </span>
</span>
