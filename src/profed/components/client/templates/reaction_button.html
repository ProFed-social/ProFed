{% set mine = (status.pleroma or {}).get("emoji_reactions", []) | selectattr("me") | list %}
<form class="reaction-area" id="reactions-{{ status.id }}" hx-post="/statuses/{{ status.id }}/react" hx-target="#reactions-{{ status.id }}" hx-swap="outerHTML">
  <details class="emoji-picker">
    <summary class="action reaction{% if mine %} is-reacted{% endif %}"
             title="{{ breakdown_title(status) }}" aria-label="React">{% if mine %}{{ mine[0].name }}{% else %}&#9825;{% endif %}
      <span class="count">{{ status.favourites_count }}</span></summary>
    <div class="picker-body">
      {% if mine %}
      <button type="button" class="action undo" title="Remove reaction" aria-label="Remove reaction"
              hx-post="/statuses/{{ status.id }}/unreact/{{ mine[0].name | urlencode }}">&#9825;</button>
      {% endif %}
      <div class="grid" hx-get="/emoji/choices" hx-trigger="toggle once from:closest details" hx-target="this" hx-swap="innerHTML"></div>
    </div>
  </details>
</form>
