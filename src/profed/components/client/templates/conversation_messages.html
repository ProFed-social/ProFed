<div id="conversation-messages" class="conversation-messages">
  {% if messages %}
  {% include "conversation_messages_page.html" %}
  {% else %}
  <p class="empty">No messages in this conversation.</p>
  {% endif %}
</div>
<script>
  (function () {
    var messages = document.getElementById("conversation-messages");
    if (messages) { messages.scrollTop = messages.scrollHeight; }
  })();
</script>
