<section class="conversation-view">
  {% if active_id is not none %}
  <header class="conversation-head">
    <a class="back" href="/conversations">&#8592; Conversations</a>
  </header>
  {% include "conversation_messages.html" %}
  <form class="conversation-compose"
        hx-post="/conversations/{{ active_id }}/reply"
        hx-target="#conversation-messages"
        hx-swap="outerHTML">
    <div class="conversation-reply-target" hidden>
      <span class="conversation-reply-target-icon">&#8617;</span>
      <span class="conversation-reply-target-name"></span>
      <span class="conversation-reply-target-text"></span>
      <button class="conversation-reply-clear" type="button" title="Cancel">&times;</button>
    </div>
    <input type="hidden" name="in_reply_to_id" value="">
    <div class="conversation-compose-row">
      <textarea class="conversation-input" name="status" rows="1" placeholder="Message…" required></textarea>
      <button class="conversation-send" type="submit">Send</button>
    </div>
  </form>
  {% else %}
  <p class="empty">No conversations yet.</p>
  {% endif %}
</section>
